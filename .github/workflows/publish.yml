name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag, for example v0.1.0
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check reviewed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_REPOSITORY: ${{ github.repository }}
        run: |
          node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!=="v"+p.version)process.exit(1)'
          node -e 'const p=require("./package.json");if(p.repository?.url!=="git+https://github.com/"+process.env.PUBLISH_REPOSITORY+".git")throw Error("Set package.repository.url to the actual GitHub repository before publishing.")'
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
