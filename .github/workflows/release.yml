name: Prepare release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)process.exit(1)'
      - name: Pack distributions
        run: |
          npm pack --pack-destination dist
          tar -czf dist/regis-skill.tar.gz -C skills regis
          cd dist
          sha256sum regis-agents-*.tgz regis-skill.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regis-release
          path: |
            dist/*.tgz
            dist/regis-skill.tar.gz
            dist/SHA256SUMS.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: regis-release
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes
